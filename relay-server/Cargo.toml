[workspace]
resolver = "2"
members = ["common", "local_store", "device", "relay"]

# Pinned so the whole workspace stays buildable with rustc 1.75.0 (Ubuntu 24.04's
# packaged compiler). Current upstream libsignal main requires rustc 1.85 / edition
# 2024, which is not obtainable in this network-restricted sandbox (no rustup /
# static.rust-lang.org access). See /docs/KNOWN_LIMITATIONS.md.
[workspace.dependencies]
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.73.0" }
rand = "0.9"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
openssl-sys = "=0.9.114"
# zeroize 1.9+ requires Cargo's unstable edition2024 feature, which isn't
# available under the rustc 1.75.0 this sandbox is limited to (see the note
# at the top of this file). Pinned to the newest version that still builds.
zeroize = "=1.8.1"
zeroize_derive = "=1.4.2"

[profile.dev]
opt-level = 0
